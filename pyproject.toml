[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ui-autotest"
version = "0.1.0"
description = "基于 Playwright 的 Web UI 用例生成与执行工具"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.48,<2.0",
  "PyYAML>=6.0,<7.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0,<9.0"]

[project.scripts]
ui-autotest = "ui_autotest.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/ui_autotest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
